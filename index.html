<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohana — A Room To Belong 🌵</title>
<meta name="description" content="Rohana — Coworking space made for focus, creativity & connection.">
<meta name="theme-color" content="#4a5c1c">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#efe6cd;--card:#f8f1de;--olive:#4a5c1c;--olive-d:#33410f;--brown:#7b3a1c;--terra:#bd5a27;--sage:#8a9a4b;--sand:#dcc08f;--ink:#3f4a17;--soft:#7d7a55;
        --display:'Rubik',sans-serif;--body:'Montserrat',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .top{display:flex;align-items:center;gap:10px;padding:14px 22px;max-width:1000px;margin:0 auto}
  .logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--olive);display:block}
  .mark{font-family:var(--display);font-weight:800;letter-spacing:2px;color:var(--olive);font-size:22px}

  .hero{position:relative;text-align:center;padding:6px 20px 96px;overflow:hidden}
  .sunbig{position:absolute;right:-70px;top:30px;width:230px;height:230px;border-radius:50%;background:var(--terra);opacity:.85}
  .hero svg.emb{position:relative}
  .hero h1{position:relative;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(42px,9vw,86px);line-height:1.02;color:var(--olive);margin:8px 0 12px}
  .hero h1 em{display:block;font-style:normal;color:var(--brown)}
  .tag{position:relative;font-weight:600;max-width:500px;margin:0 auto;font-size:16px}
  .hills{position:absolute;left:0;bottom:-1px;width:100%;height:90px;display:block}
  .cactus{position:absolute;bottom:34px;width:46px;height:92px}

  .card{position:relative;z-index:2;background:var(--card);max-width:560px;margin:-34px auto 0;border-radius:28px;padding:26px 22px;border:2px solid var(--sand);box-shadow:0 20px 50px rgba(74,92,28,.18)}
  .pill{display:inline-block;background:var(--olive);color:var(--bg);font-family:var(--display);font-weight:700;padding:7px 24px;border-radius:999px 999px 999px 14px;letter-spacing:.5px;text-transform:uppercase;font-size:14px}
  .lbl{display:block;font-family:var(--display);font-weight:600;font-size:14px;color:var(--olive);margin:18px 0 6px}
  .opt{display:flex;align-items:baseline;gap:8px;padding:11px 14px;border-radius:16px;cursor:pointer;font-weight:700;font-size:15px}
  .opt:hover{background:#efe3c3}
  .opt .d{flex:1;border-bottom:2px dotted #b7a676;transform:translateY(-4px)}
  .opt .p{font-family:var(--display);font-weight:700;color:var(--brown);white-space:nowrap}
  .opt.on{background:var(--olive);color:var(--bg)}.opt.on .d{border-color:#a8b57a}.opt.on .p{color:#f3d9a0}
  input,select{width:100%;padding:12px 14px;border:2px solid var(--sand);border-radius:14px;font:600 15px var(--body);background:#fffaf0;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--olive)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .avail{display:none;margin-top:12px;font-size:13px;font-weight:700;padding:9px 14px;border-radius:12px}
  .avail.show{display:block}.busy{background:#f6dcd0;color:#9a2f12;border:2px solid var(--terra)}.free{background:#e4ebcb;color:var(--olive-d);border:2px solid var(--sage)}
  .total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 16px;border-radius:16px;background:#efe3c3;font-weight:700}
  .total b{font-family:var(--display);color:var(--brown);font-size:20px}
  .submit{width:100%;margin-top:16px;background:var(--olive);color:var(--bg);border:none;padding:15px;border-radius:999px;font:700 16px var(--display);letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
  .submit:hover{background:var(--olive-d)}.submit:disabled{opacity:.5;cursor:not-allowed}
  .status{display:none;margin-top:14px;font-size:13.5px;padding:12px 14px;border-radius:12px;font-weight:700;text-align:center}
  .status.show{display:block}.ok{background:#e4ebcb;color:var(--olive-d)}.err{background:#f6dcd0;color:#9a2f12}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .menu-btn{background:var(--terra);color:#fff;border:none;border-radius:999px 14px 999px 999px;padding:7px 22px;font:700 14px var(--display);letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
  .menu-btn:hover{background:var(--brown)}
  .icons{display:flex;gap:8px;margin-inline-start:auto}
  .icons a{width:38px;height:38px;border-radius:50%;background:var(--olive);color:var(--bg);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
  .icons a:hover{background:var(--terra);transform:translateY(-2px)}
  .icons svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mm{position:fixed;inset:0;background:rgba(51,65,15,.88);z-index:100;display:none;flex-direction:column;align-items:center;padding:16px 12px}
  .mm.show{display:flex}
  .mm-bar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--bg);font:700 18px var(--display);text-transform:uppercase;letter-spacing:1px}
  .mm-x{background:var(--bg);color:var(--olive);border:none;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer}
  .mm-pages{width:100%;max-width:560px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
  .mm-pages img{width:100%;border-radius:14px;display:block}
  footer{margin-top:60px;position:relative}
  footer .hills{position:static;height:90px}
  .band{background:var(--olive);color:#efe6cd;padding:22px 22px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:600}
  .band .mark{color:#efe6cd;font-size:20px;display:flex;align-items:center;gap:10px}.band .logo{width:34px;height:34px;border-color:#efe6cd}
  .band .sc{font-family:var(--display);font-weight:600;font-size:16px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="hl"><path d="M0 55Q180 15 380 50T760 45T1200 30V100H0Z" fill="#dcc08f"/><path d="M0 72Q240 38 520 68T1200 58V100H0Z" fill="#bd5a27"/><path d="M0 90Q300 66 620 88T1200 80V100H0Z" fill="#4a5c1c"/></g>
  <g id="cx" fill="#6e8a3a"><rect x="21" y="8" width="18" height="110" rx="9"/><path d="M21 76h-9a6 6 0 0 1-6-6V50a6 6 0 0 1 12 0v14h3z"/><path d="M39 60h9a6 6 0 0 0 6-6V36a6 6 0 0 0-12 0v12h-3z"/></g>
  <g id="sn" fill="#7b3a1c"><path d="M32 60a28 28 0 0 1 56 0z"/><path d="M60 2l11 22H49z"/><path d="M12 20l24 8-8 12z"/><path d="M108 20l-24 8 8 12z"/></g>
</defs></svg>

<div class="top"><img class="logo" data-logo alt="R"><span class="mark">ROHANA</span></div>

<section class="hero">
  <div class="sunbig"></div>
  <svg class="emb" width="86" height="43" viewBox="0 0 120 60"><use href="#sn"/></svg>
  <h1>A Room <em>To Belong.</em></h1>
  <p class="tag">Coworking space made for focus, creativity &amp; connection 🌵</p>
  <svg class="cactus" style="left:5%" viewBox="0 0 60 120"><use href="#cx"/></svg>
  <svg class="cactus" style="right:7%;height:70px;width:35px" viewBox="0 0 60 120"><use href="#cx"/></svg>
  <svg class="hills" viewBox="0 0 1200 100" preserveAspectRatio="none"><use href="#hl"/></svg>
</section>

<form class="card" id="f">
  <div class="bar">
    <span class="pill">Book Your Spot</span>
    <button type="button" class="menu-btn" id="menuBtn">Menu</button>
    <span class="icons">
      <a href="https://www.instagram.com/rohana.eg" target="_blank" rel="noopener" aria-label="Rohana on Instagram" title="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://maps.app.goo.gl/QjhV1Chvf9LfDL7K8" target="_blank" rel="noopener" aria-label="Rohana location" title="Location"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg></a>
    </span>
  </div>
  <label class="lbl">Choose Your Experience *</label>
  <div id="opts"></div>
  <label class="lbl" for="date">Date *</label><input type="date" id="date" required>
  <div class="row">
    <div><label class="lbl" for="time">Start time *</label><select id="time"></select></div>
    <div><label class="lbl" for="dur">Duration *</label><select id="dur"></select></div>
  </div>
  <div class="avail" id="avail"></div>
  <div class="row">
    <div><label class="lbl" for="name">Full name *</label><input id="name" required placeholder="Your name"></div>
    <div><label class="lbl" for="phone">Phone *</label><input id="phone" type="tel" required placeholder="01012345678"></div>
  </div>
  <div class="total"><span>Total</span><b id="total">0 EGP</b></div>
  <button class="submit" id="btn">Book now</button>
  <div class="status" id="st"></div>
</form>

<footer>
  <svg class="hills" viewBox="0 0 1200 100" preserveAspectRatio="none"><use href="#hl"/></svg>
  <div class="band">
    <span class="mark"><img class="logo" data-logo alt="R">ROHANA</span>
    <span class="sc">A Room To Belong. 🌵</span>
    <span>© <span id="year"></span> Rohana</span>
  </div>
</footer>

<div class="mm" id="mm">
  <div class="mm-bar"><span>Our Menu</span><button type="button" class="mm-x" id="mmX" aria-label="Close">✕</button></div>
  <div class="mm-pages" id="mmPages"></div>
</div>

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const t12 = h => `${h % 12 || 12}:00 ${h < 12 ? 'AM' : 'PM'}`;
  const live = () => SCRIPT_URL && !SCRIPT_URL.includes('PASTE_YOUR');
  let cur = 0, booked = [], busy = false;

  document.querySelectorAll('[data-logo]').forEach(i => i.src = LOGO);
  const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = LOGO; document.head.appendChild(fav);
  $('year').textContent = new Date().getFullYear();

  $('opts').innerHTML = SPACES.map((s, i) =>
    `<div class="opt${i ? '' : ' on'}" data-i="${i}"><span>${s.name.replace('&', '&amp;')}</span><span class="d"></span><span class="p">${s.rate} EGP/h</span></div>`).join('');
  $('opts').onclick = e => {
    const el = e.target.closest('.opt'); if (!el) return;
    document.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
    el.classList.add('on'); cur = +el.dataset.i; update();
  };
  $('time').innerHTML = Array.from({ length: CLOSE - OPEN }, (_, i) => `<option value="${pad(OPEN + i)}:00">${t12(OPEN + i)}</option>`).join('');
  $('dur').innerHTML = [1, 2, 3, 4, 6, 8].map(d => `<option value="${d}">${d} ${d === 1 ? 'hour' : 'hours'}</option>`).join('');
  $('date').min = $('date').value = new Date().toLocaleDateString('en-CA');

  async function loadDay() {
    booked = [];
    if (live() && $('date').value) {
      try { booked = (await (await fetch(`${SCRIPT_URL}?action=day&date=${$('date').value}`)).json()).booked || []; } catch (e) {}
    }
    update();
  }

  function update() {
    const sp = SPACES[cur], h = +$('time').value.slice(0, 2), d = +$('dur').value, s0 = h * 60, e0 = s0 + d * 60;
    $('total').textContent = sp.rate * d + ' EGP';
    let m, bad = false;
    if (h + d > CLOSE) { m = `We close at ${t12(CLOSE)} — shorten the duration or start earlier`; bad = true; }
    else if (booked.filter(b => b.space === sp.name && s0 < b.end && e0 > b.start).length >= sp.seats) { m = 'That time is fully booked — please try another slot'; bad = true; }
    else m = 'This slot is available ✓';
    $('avail').textContent = m; $('avail').className = 'avail show ' + (bad ? 'busy' : 'free');
    busy = bad; $('btn').disabled = bad;
  }
  ['time', 'dur'].forEach(i => $(i).onchange = update);
  $('date').onchange = loadDay;

  $('f').onsubmit = async e => {
    e.preventDefault(); if (busy) return;
    const wa = window.open('', '_blank');   // open right away so the browser doesn't block it
    $('btn').disabled = true; $('btn').textContent = 'Booking…';
    const sp = SPACES[cur], d = +$('dur').value;
    const data = { space: sp.name, date: $('date').value, time: $('time').value, duration: d, name: $('name').value.trim(),
                   phone: $('phone').value.trim(), total: sp.rate * d, timestamp: new Date().toISOString() };
    let sent = false;
    if (live()) {
      try { await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data) }); sent = true; } catch (err) {}
    }
    const text = `New booking at Rohana:\nName: ${data.name}\nExperience: ${sp.name}\nDate: ${data.date}\nTime: ${t12(+data.time.slice(0, 2))}\nDuration: ${d} h\nTotal: ${data.total} EGP\nPhone: ${data.phone}`;
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
    $('st').textContent = sent ? 'Booking saved — opening WhatsApp!' : 'Sent to WhatsApp only — check the script link';
    $('st').className = 'status show ' + (sent ? 'ok' : 'err');
    if (wa) wa.location.href = url; else location.href = url;
    $('btn').textContent = 'Book now'; setTimeout(loadDay, 1500);
  };
  // ---- Menu popup ----
  const mm = $('mm');
  $('menuBtn').onclick = () => {
    if (MENU_URL) return window.open(MENU_URL, '_blank');
    if (!$('mmPages').children.length) $('mmPages').innerHTML = MENU_IMAGES.map(src => `<img src="${src}" alt="Rohana menu" loading="lazy">`).join('');
    mm.classList.add('show'); document.body.style.overflow = 'hidden';
  };
  const closeMenu = () => { mm.classList.remove('show'); document.body.style.overflow = ''; };
  $('mmX').onclick = closeMenu;
  mm.onclick = e => { if (e.target === mm) closeMenu(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

  loadDay();
</script>
</body>
